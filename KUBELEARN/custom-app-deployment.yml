apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-app-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-app
  template:
    metadata:
      name: hello-world-app
      labels:
        app: hello-world-app
    spec:
      containers:
        - name: hello-app-container
          image: nithinreddyyelluri/kubernetes:v1
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort
  selector:
    app: hello-world-app
  ports:
    - port: 9000
      targetPort: 8080
      nodePort: 30401

