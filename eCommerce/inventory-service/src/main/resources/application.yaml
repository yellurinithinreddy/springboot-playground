spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:3306/inventorydb?useSSL=false
    username: root
    password: Nithinreddy9491$

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql


server:
  port: 9030
  servlet:
    context-path: /inventory

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true #(ise IP instead of hostname for registration (use ful for containers))
    lease-renewal-interval-in-seconds: 10 #(default is 30)
    lease-expiration-duration-in-seconds: 30 #(default is 90)

