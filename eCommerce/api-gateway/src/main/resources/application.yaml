server:
  port: 8080
spring:
  application:
    name: api-gateway



  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name: LoggingOrdersFilter
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Nithin
#                - RedirectTo=302, https://codingshuttle.com
#                - RemoveRequestHeader=cookie
            - id: shipping-service
              uri: lb://SHIPPING-SERVICE
              predicates:
                - Path=/api/v1/shippings/**
                - Method=GET
              filters:
                - StripPrefix=2






eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka



